<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a1929;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1a2440;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#22d3ee;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#06b6d4;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="snakeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3b82f6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#8b5cf6;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="96" fill="url(#bgGrad)"/>

  <!-- Decorative circles -->
  <circle cx="100" cy="100" r="60" fill="#22d3ee" opacity="0.1"/>
  <circle cx="412" cy="412" r="80" fill="#06b6d4" opacity="0.1"/>

  <!-- Stack of Cards (3 cards) -->
  <!-- Card 3 (back) -->
  <rect x="130" y="190" width="252" height="160" rx="16" fill="#0f1629" opacity="0.4" transform="rotate(-4 256 270)"/>

  <!-- Card 2 (middle) -->
  <rect x="130" y="190" width="252" height="160" rx="16" fill="#0f1629" opacity="0.6" transform="rotate(-2 256 270)"/>

  <!-- Card 1 (front) - main card with Python logo -->
  <rect x="130" y="190" width="252" height="160" rx="16" fill="url(#cardGrad)" transform="rotate(0 256 270)"/>
  <rect x="138" y="198" width="236" height="144" rx="12" fill="#0a1929" opacity="0.8"/>

  <!-- Python snake on card -->
  <g transform="translate(256, 270)">
    <!-- Python logo inspired design -->
    <!-- Blue snake (top) -->
    <path d="M -35,-25 Q -35,-40 -20,-40 L 10,-40 Q 25,-40 25,-25 L 25,0 Q 25,10 15,10 L -15,10 Q -25,10 -25,0 Z"
          fill="url(#snakeGrad)" opacity="0.9"/>
    <circle cx="-20" cy="-32" r="3" fill="#ffffff"/>

    <!-- Yellow/cyan snake (bottom) -->
    <path d="M 35,25 Q 35,40 20,40 L -10,40 Q -25,40 -25,25 L -25,0 Q -25,-10 -15,-10 L 15,-10 Q 25,-10 25,0 Z"
          fill="#22d3ee" opacity="0.9"/>
    <circle cx="20" cy="32" r="3" fill="#0a1929"/>
  </g>

  <!-- PyDeck text -->
  <text x="256" y="420" font-family="'Inter', Arial, sans-serif" font-size="56" font-weight="800"
        fill="#22d3ee" text-anchor="middle" letter-spacing="-1">
    PyDeck
  </text>

  <!-- Subtitle -->
  <text x="256" y="455" font-family="'Inter', Arial, sans-serif" font-size="20" font-weight="500"
        fill="#06b6d4" text-anchor="middle" letter-spacing="2" opacity="0.8">
    MASTER PYTHON
  </text>
</svg>
