<!DOCTYPE html>
<html>
<head>
    <title>PyDeck Icon Generator - Holo Fan</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 40px;
            background: #060a13;
            color: white;
        }
        h1 { color: #22d3ee; margin-bottom: 4px; }
        p { color: #94a3b8; margin-top: 0; }
        canvas { margin: 20px; border-radius: 16px; display: block; }
        button {
            background: linear-gradient(to right, #22d3ee, #3b82f6);
            color: #060a13;
            border: none;
            padding: 12px 24px;
            font-size: 14px;
            font-weight: bold;
            border-radius: 10px;
            cursor: pointer;
            margin: 6px;
        }
        button:hover { opacity: 0.85; }
        .preview { display: flex; gap: 30px; flex-wrap: wrap; justify-content: center; margin-top: 20px; }
        .icon-container { text-align: center; color: #94a3b8; font-size: 13px; }
        .dl-all {
            margin-top: 30px;
            font-size: 16px;
            padding: 16px 36px;
            background: linear-gradient(to right, #a855f7, #3b82f6);
        }
        .instructions {
            margin-top: 24px;
            padding: 16px 24px;
            background: rgba(34,211,238,0.08);
            border: 1px solid rgba(34,211,238,0.2);
            border-radius: 12px;
            color: #94a3b8;
            font-size: 13px;
            max-width: 600px;
            text-align: center;
            line-height: 1.7;
        }
        .instructions strong { color: #22d3ee; }
    </style>
</head>
<body>
    <h1>PyDeck Icon Generator</h1>
    <p>All 6 letters (P · Y · D · E · C · K) fully visible</p>

    <div class="preview">
        <div class="icon-container">
            <p>512×512 · Android</p>
            <canvas id="icon512" width="512" height="512"></canvas>
            <button onclick="dl('icon512','icon-512.png')">⬇ Download 512×512</button>
        </div>
        <div class="icon-container">
            <p>192×192 · Android</p>
            <canvas id="icon192" width="192" height="192"></canvas>
            <button onclick="dl('icon192','icon-192.png')">⬇ Download 192×192</button>
        </div>
        <div class="icon-container">
            <p>180×180 · iOS</p>
            <canvas id="icon180" width="180" height="180"></canvas>
            <button onclick="dl('icon180','apple-touch-icon.png')">⬇ Download iOS Icon</button>
        </div>
        <div class="icon-container">
            <p>32×32 · Favicon</p>
            <canvas id="favicon" width="32" height="32"></canvas>
            <button onclick="dl('favicon','favicon.png')">⬇ Download Favicon</button>
        </div>
    </div>

    <button class="dl-all" onclick="dlAll()">📥 Download All Icons</button>

    <div class="instructions">
        After downloading, move all 4 files into<br>
        <strong>frontend/public/</strong> replacing the existing icons.<br>
        Then rebuild or restart the dev server to see them take effect.
    </div>

    <script>
        const CARDS = [
            { letter: 'P', g: ['#1e3a8a', '#2563eb', '#3b82f6'], glow: 'rgba(59,130,246,0.92)' },
            { letter: 'Y', g: ['#78350f', '#d97706', '#f59e0b'], glow: 'rgba(245,158,11,0.92)' },
            { letter: 'D', g: ['#1a1a2e', '#374151', '#6b7280'], glow: 'rgba(107,114,128,0.80)' },
            { letter: 'E', g: ['#064e3b', '#059669', '#10b981'], glow: 'rgba(16,185,129,0.92)' },
            { letter: 'C', g: ['#7c2d12', '#ea580c', '#f97316'], glow: 'rgba(249,115,22,0.92)' },
            { letter: 'K', g: ['#4c1d95', '#7c3aed', '#a855f7'], glow: 'rgba(168,85,247,0.92)' },
        ]

        function rr(ctx, x, y, w, h, r) {
            ctx.beginPath()
            ctx.moveTo(x + r, y)
            ctx.lineTo(x + w - r, y)
            ctx.quadraticCurveTo(x + w, y, x + w, y + r)
            ctx.lineTo(x + w, y + h - r)
            ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h)
            ctx.lineTo(x + r, y + h)
            ctx.quadraticCurveTo(x, y + h, x, y + h - r)
            ctx.lineTo(x, y + r)
            ctx.quadraticCurveTo(x, y, x + r, y)
            ctx.closePath()
        }

        function drawIcon(canvas) {
            const ctx = canvas.getContext('2d')
            const S = canvas.width

            // ── Background ──────────────────────────────────────────────────
            const bg = ctx.createRadialGradient(S * 0.5, S * 0.35, 0, S * 0.5, S * 0.5, S * 0.85)
            bg.addColorStop(0, '#131c2e')
            bg.addColorStop(1, '#060a13')
            ctx.fillStyle = bg
            ctx.fillRect(0, 0, S, S)

            // Clip so rotated card edges never bleed outside icon bounds
            ctx.save()
            ctx.beginPath()
            ctx.rect(0, 0, S, S)
            ctx.clip()

            // ── Card geometry ───────────────────────────────────────────────
            //
            // KEY RULE for "all letters visible":
            //   horizontal spread between adjacent cards > card half-width
            //   so each card's center (letter) peeks out from behind its neighbour
            //
            // spread per unit = S * 0.120
            // card half-width = S * 0.105  →  0.120 > 0.105 ✓ every letter exposed
            //
            const cW   = S * 0.21    // card width
            const cH   = S * 0.56    // card height  — tall to fill vertical space
            const cr   = S * 0.030   // corner radius
            const SPREAD = S * 0.120  // horizontal distance between adjacent card centres

            const fanX = S * 0.5
            const fanY = S * 0.525   // fan pivot centre (moved up from 0.66)

            // Draw order: outer cards first so centre cards sit on top
            // but every letter still peeks out thanks to spread > half-width
            const drawOrder = [0, 5, 1, 4, 2, 3]

            drawOrder.forEach(i => {
                const card  = CARDS[i]
                const pos   = i - 2.5            // –2.5 … +2.5
                const aPos  = Math.abs(pos)
                // 5° per position — tight angle so cards don't go out of bounds
                const angle = pos * 5 * Math.PI / 180

                const cx = fanX + pos * SPREAD
                const cy = fanY + aPos * S * 0.018 - S * 0.018   // subtle arch

                // Rotate around bottom-centre of card
                const pivX = cx
                const pivY = cy + cH * 0.5

                ctx.save()
                ctx.translate(pivX, pivY)
                ctx.rotate(angle)
                ctx.translate(-pivX, -pivY)

                const x = cx - cW * 0.5
                const y = cy - cH * 0.5

                // Card gradient
                const grad = ctx.createLinearGradient(x, y, x + cW, y + cH)
                grad.addColorStop(0,    card.g[0])
                grad.addColorStop(0.55, card.g[1])
                grad.addColorStop(1,    card.g[2])

                // Glow
                ctx.shadowColor = card.glow
                ctx.shadowBlur  = S * 0.055

                ctx.fillStyle = grad
                rr(ctx, x, y, cW, cH, cr)
                ctx.fill()

                // Glowing border
                ctx.shadowBlur  = 0
                ctx.strokeStyle = card.glow
                ctx.lineWidth   = S * 0.0042
                rr(ctx, x, y, cW, cH, cr)
                ctx.stroke()

                // Foil sheen
                const foil = ctx.createLinearGradient(x, y, x + cW, y + cH)
                foil.addColorStop(0,    'rgba(255,255,255,0.16)')
                foil.addColorStop(0.45, 'rgba(255,255,255,0)')
                foil.addColorStop(1,    'rgba(255,255,255,0.07)')
                ctx.fillStyle = foil
                rr(ctx, x, y, cW, cH, cr)
                ctx.fill()

                // Letter — centered in card, always in the exposed strip
                ctx.shadowColor  = card.glow
                ctx.shadowBlur   = S * 0.052
                ctx.fillStyle    = '#ffffff'
                ctx.font         = `900 ${Math.round(S * 0.098)}px Inter, Arial, sans-serif`
                ctx.textAlign    = 'center'
                ctx.textBaseline = 'middle'
                ctx.fillText(card.letter, cx, cy)
                ctx.shadowBlur = 0

                ctx.restore()
            })

            ctx.restore() // end clip

            // Ambient glow at bottom
            const glow = ctx.createRadialGradient(S * 0.5, S * 0.84, 0, S * 0.5, S * 0.84, S * 0.50)
            glow.addColorStop(0, 'rgba(59,130,246,0.14)')
            glow.addColorStop(1, 'rgba(0,0,0,0)')
            ctx.fillStyle = glow
            ctx.fillRect(0, 0, S, S)
        }

        ;['icon512', 'icon192', 'icon180', 'favicon'].forEach(id => {
            drawIcon(document.getElementById(id))
        })

        function dl(canvasId, filename) {
            const a = document.createElement('a')
            a.download = filename
            a.href = document.getElementById(canvasId).toDataURL('image/png')
            a.click()
        }

        function dlAll() {
            setTimeout(() => dl('icon192',  'icon-192.png'),          100)
            setTimeout(() => dl('icon512',  'icon-512.png'),          300)
            setTimeout(() => dl('icon180',  'apple-touch-icon.png'),  500)
            setTimeout(() => dl('favicon',  'favicon.png'),           700)
            setTimeout(() => alert('✅ All 4 icons downloaded!\n\nMove them to frontend/public/ replacing the existing files.'), 900)
        }
    </script>
</body>
</html>
