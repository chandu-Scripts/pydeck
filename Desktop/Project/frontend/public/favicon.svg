<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#060a13"/>
      <stop offset="100%" style="stop-color:#0d1a2e"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#22d3ee"/>
      <stop offset="100%" style="stop-color:#06b6d4"/>
    </linearGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff"/>
      <stop offset="100%" style="stop-color:#a5f3fc"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="108" fill="url(#bg)"/>

  <!-- Subtle glow -->
  <ellipse cx="256" cy="240" rx="180" ry="140" fill="#22d3ee" opacity="0.08"/>

  <!-- Back cards (stacked) -->
  <rect x="100" y="155" width="312" height="210" rx="20" fill="#0f1e35" opacity="0.6" transform="rotate(-6 256 260)"/>
  <rect x="100" y="155" width="312" height="210" rx="20" fill="#122038" opacity="0.8" transform="rotate(-3 256 260)"/>

  <!-- Front card body -->
  <rect x="100" y="155" width="312" height="210" rx="20" fill="url(#cardGrad)" filter="url(#glow)"/>
  <rect x="112" y="167" width="288" height="186" rx="14" fill="#060a13" opacity="0.92"/>

  <!-- Decorative corner dots -->
  <circle cx="130" cy="185" r="5" fill="#22d3ee" opacity="0.5"/>
  <circle cx="382" cy="185" r="5" fill="#22d3ee" opacity="0.5"/>
  <circle cx="130" cy="335" r="5" fill="#22d3ee" opacity="0.5"/>
  <circle cx="382" cy="335" r="5" fill="#22d3ee" opacity="0.5"/>

  <!-- "Py" text centered on card -->
  <text x="256" y="305"
        font-family="'Inter', Arial, sans-serif"
        font-size="130"
        font-weight="900"
        fill="url(#textGrad)"
        text-anchor="middle"
        letter-spacing="-4">Py</text>

  <!-- Thin cyan underline accent -->
  <rect x="186" y="318" width="140" height="4" rx="2" fill="#22d3ee" opacity="0.7"/>

  <!-- "DECK" small label below card -->
  <text x="256" y="408"
        font-family="'Inter', Arial, sans-serif"
        font-size="38"
        font-weight="700"
        fill="#22d3ee"
        text-anchor="middle"
        letter-spacing="12"
        opacity="0.85">DECK</text>
</svg>
